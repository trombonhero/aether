<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER LINKS - Refined</title>
    <style>
        /* --- STILE VISIVO --- */
        :root { 
            --bg: #020617; 
            --accent: #22d3ee; 
            --text: #94a3b8;
            --complete: #38bdf8;
            --error: #ef4444;
            --panel-bg: rgba(15, 23, 42, 0.8);
        }


        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh; width: 100vw;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            display: flex; flex-direction: column;
        }


        /* UI LAYER */
        #ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
            padding: 1.5rem;
        }


        /* HEADER & CONTROLS CONTAINER */
        .top-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%;
            pointer-events: auto; /* Permette click sui bottoni */
        }


        .title-group {
            text-align: left;
        }


        h1 { 
            font-size: 1.5rem; margin: 0; letter-spacing: 0.2em; 
            color: white; text-shadow: 0 0 15px var(--accent); 
            font-weight: 300;
        }
        .subtitle { 
            font-size: 0.7rem; letter-spacing: 0.1em; margin-top: 4px; 
            color: var(--accent); opacity: 0.8;
        }


        /* MINI DICE BUTTON (Top Right) */
        .dice-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #475569;
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .dice-btn:active { transform: scale(0.9); background: var(--accent); border-color: var(--accent); }
        .dice-btn:active svg { stroke: #000; }
        
        .dice-icon {
            width: 24px; height: 24px;
            fill: none; stroke: #a78bfa; stroke-width: 2;
            transition: stroke 0.2s;
        }


        /* CANVAS */
        canvas { display: block; width: 100%; height: 100%; }


        /* WIN OVERLAY */
        #win-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0; transition: opacity 1s; pointer-events: none;
            z-index: 20;
        }
        #win-msg.visible { opacity: 1; }
        .win-text { 
            font-size: 3rem; color: var(--complete); 
            letter-spacing: 0.5em; text-shadow: 0 0 40px var(--complete); 
            font-weight: 100;
        }


        @keyframes shake {
            0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); }
        }
        .shaking { animation: shake 0.4s ease-in-out; }


    </style>
</head>
<body>


    <div id="ui-layer">
        <div class="top-bar">
            <div class="title-group">
                <h1>AETHER</h1>
                <div class="subtitle" id="status-text">STABILIZZA</div>
            </div>


            <div class="dice-btn" id="btn-dice" title="Scossa">
                <svg class="dice-icon" viewBox="0 0 24 24" id="dice-svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
        </div>


        <div id="win-msg">
            <div class="win-text">LINKED</div>
        </div>
    </div>


    <canvas id="canvas"></canvas>


    <script>
        // --- CONFIG ---
        const COLORS = {
            base: '#1e293b',
            stroke: '#475569',
            active: '#22d3ee', 
            error: '#ef4444',  
            complete: '#0f172a',
            linkCore: '#fff',
            linkGlow: 'rgba(34, 211, 238, 0.3)'
        };


        const PHYSICS = {
            topPadding: 100, // Safe zone per header
            padding: 40,     // Safe zone bordi
            repulsion: 350,
            springLen: 140,
            friction: 0.94
        };


        class Game {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.diceBtn = document.getElementById('btn-dice');
                this.status = document.getElementById('status-text');
                this.winMsg = document.getElementById('win-msg');
                
                this.nodes = [];
                this.links = []; 
                
                this.drag = { active: false, startNode: null, curr: {x:0,y:0} };
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Input
                this.canvas.addEventListener('pointerdown', e => this.onDown(e));
                window.addEventListener('pointermove', e => this.onMove(e));
                window.addEventListener('pointerup', e => this.onUp(e));
                
                // Dice
                this.diceBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita click sul canvas sotto
                    this.shakeWorld();
                });


                // Init
                this.generateLevel();
                this.loop();
            }


            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }


            // --- MATH HELPER ---
            // Distanza punto (p) da segmento (v-w)
            distToSegment(p, v, w) {
                const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
                if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
                let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
            }


            // --- LOGIC ---
            generateLevel() {
                this.nodes = [];
                this.links = [];
                this.winMsg.classList.remove('visible');
                
                const nodeCount = Math.floor(Math.random() * 3) + 5; 
                
                // Spawn safe area
                const spawnW = this.width - PHYSICS.padding*2;
                const spawnH = this.height - PHYSICS.topPadding - PHYSICS.padding;


                for(let i=0; i<nodeCount; i++) {
                    this.nodes.push({
                        id: i,
                        x: Math.random() * spawnW + PHYSICS.padding,
                        y: Math.random() * spawnH + PHYSICS.topPadding,
                        vx: 0, vy: 0,
                        req: 0,
                        radius: 25
                    });
                }


                // Genera soluzione valida
                let connected = [this.nodes[0]];
                let pool = this.nodes.slice(1);
                let virtualLinks = [];


                while(pool.length > 0) {
                    const src = connected[Math.floor(Math.random() * connected.length)];
                    const dst = pool[Math.floor(Math.random() * pool.length)];
                    const count = Math.random() > 0.7 ? 2 : 1;
                    virtualLinks.push({a: src, b: dst, count});
                    connected.push(dst);
                    pool = pool.filter(n => n !== dst);
                }


                // Cicli extra
                for(let i=0; i<2; i++) {
                    const a = this.nodes[Math.floor(Math.random()*this.nodes.length)];
                    const b = this.nodes[Math.floor(Math.random()*this.nodes.length)];
                    if(a !== b && !virtualLinks.some(l => (l.a===a && l.b===b) || (l.a===b && l.b===a))) {
                        virtualLinks.push({a, b, count: 1});
                    }
                }


                this.nodes.forEach(n => {
                    let req = 0;
                    virtualLinks.forEach(l => { if(l.a===n || l.b===n) req += l.count; });
                    n.req = req;
                });


                this.nodes = this.nodes.filter(n => n.req > 0);
            }


            shakeWorld() {
                document.getElementById('dice-svg').classList.add('shaking');
                setTimeout(() => document.getElementById('dice-svg').classList.remove('shaking'), 400);
                this.nodes.forEach(n => {
                    n.vx += (Math.random() - 0.5) * 25;
                    n.vy += (Math.random() - 0.5) * 25;
                });
            }


            // --- FISICA ---
            update() {
                // Repulsione
                for(let i=0; i<this.nodes.length; i++) {
                    for(let j=i+1; j<this.nodes.length; j++) {
                        const a = this.nodes[i];
                        const b = this.nodes[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx*dx + dy*dy;
                        const dist = Math.sqrt(distSq);
                        
                        if(dist < PHYSICS.repulsion) { 
                            const force = PHYSICS.repulsion / (distSq + 1); 
                            const fx = (dx/dist) * force;
                            const fy = (dy/dist) * force;
                            a.vx += fx; a.vy += fy;
                            b.vx -= fx; b.vy -= fy;
                        }
                    }
                }


                // Attrazione Link
                this.links.forEach(l => {
                    const dx = l.b.x - l.a.x;
                    const dy = l.b.y - l.a.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    const force = (dist - PHYSICS.springLen) * 0.005;
                    const fx = (dx/dist) * force;
                    const fy = (dy/dist) * force;
                    
                    l.a.vx += fx; l.a.vy += fy;
                    l.b.vx -= fx; l.b.vy -= fy;
                });


                // Confini e Movimento
                this.nodes.forEach(n => {
                    // Centro di gravità debole verso il centro dell'area giocabile
                    const cx = this.width / 2;
                    const cy = PHYSICS.topPadding + (this.height - PHYSICS.topPadding) / 2;
                    
                    n.vx += (cx - n.x) * 0.0003;
                    n.vy += (cy - n.y) * 0.0003;
                    
                    n.x += n.vx;
                    n.y += n.vy;
                    n.vx *= PHYSICS.friction;
                    n.vy *= PHYSICS.friction;


                    // Muri Rimbalzanti (Soft Walls)
                    const pad = PHYSICS.padding;
                    const topPad = PHYSICS.topPadding;
                    
                    if(n.x < pad) { n.x = pad; n.vx *= -0.5; }
                    if(n.x > this.width - pad) { n.x = this.width - pad; n.vx *= -0.5; }
                    if(n.y < topPad) { n.y = topPad; n.vy *= -0.5; } // Header Safe Zone
                    if(n.y > this.height - pad) { n.y = this.height - pad; n.vy *= -0.5; }
                });
            }


            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);


                // Links
                this.links.forEach(l => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(l.a.x, l.a.y);
                    this.ctx.lineTo(l.b.x, l.b.y);
                    
                    if(l.count === 2) {
                        this.ctx.lineWidth = 6;
                        this.ctx.strokeStyle = COLORS.linkGlow;
                        this.ctx.stroke();
                        this.ctx.lineWidth = 2;
                        this.ctx.strokeStyle = COLORS.linkCore;
                        this.ctx.stroke();
                    } else {
                        this.ctx.lineWidth = 2;
                        this.ctx.strokeStyle = COLORS.active;
                        this.ctx.stroke();
                    }
                });


                // Drag Line
                if(this.drag.active) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.drag.startNode.x, this.drag.startNode.y);
                    this.ctx.lineTo(this.drag.curr.x, this.drag.curr.y);
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    this.ctx.setLineDash([10, 10]);
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }


                // Nodes
                this.nodes.forEach(n => {
                    let cur = 0;
                    this.links.forEach(l => { if(l.a===n || l.b===n) cur += l.count; });
                    
                    const isComplete = cur === n.req;
                    const isOver = cur > n.req;


                    if(isComplete) {
                        this.ctx.shadowBlur = 30;
                        this.ctx.shadowColor = COLORS.active;
                    } else {
                        this.ctx.shadowBlur = 0;
                    }


                    this.ctx.beginPath();
                    this.ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
                    this.ctx.fillStyle = isComplete ? COLORS.complete : COLORS.base;
                    this.ctx.fill();
                    
                    this.ctx.lineWidth = isComplete ? 3 : 2;
                    this.ctx.strokeStyle = isOver ? COLORS.error : (isComplete ? COLORS.active : COLORS.stroke);
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;


                    this.ctx.fillStyle = isComplete ? '#fff' : COLORS.active;
                    this.ctx.font = "bold 20px Courier New";
                    this.ctx.textAlign = "center";
                    this.ctx.textBaseline = "middle";
                    this.ctx.fillText(n.req, n.x, n.y + 2);
                });
            }


            // --- INPUT ---
            getPos(e) { return { x: e.clientX, y: e.clientY }; }


            onDown(e) {
                const pos = this.getPos(e);
                
                // 1. Check Node Drag
                const target = this.nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < n.radius + 10);
                if(target) {
                    this.drag.active = true;
                    this.drag.startNode = target;
                    this.drag.curr = pos;
                    return;
                }


                // 2. Check Link Click (Cancellation)
                for(let i=0; i<this.links.length; i++) {
                    const l = this.links[i];
                    // Calcola distanza dal punto di click al segmento del ponte
                    const dist = this.distToSegment(pos, l.a, l.b);
                    
                    if(dist < 20) { // Hitbox di 20px attorno alla linea
                        // Elimina il link (o riduci se preferisci logica 2->1)
                        // Richiesta utente: "si elimina"
                        this.links.splice(i, 1);
                        this.checkWin();
                        return;
                    }
                }
            }


            onMove(e) {
                if(this.drag.active) this.drag.curr = this.getPos(e);
            }


            onUp(e) {
                if(!this.drag.active) return;
                
                const pos = this.getPos(e);
                const target = this.nodes.find(n => 
                    n !== this.drag.startNode && 
                    Math.hypot(n.x - pos.x, n.y - pos.y) < n.radius + 15
                );


                if(target) {
                    this.toggleLink(this.drag.startNode, target);
                }


                this.drag.active = false;
                this.drag.startNode = null;
            }


            toggleLink(a, b) {
                const existing = this.links.find(l => (l.a===a && l.b===b) || (l.a===b && l.b===a));
                
                if(existing) {
                    if(existing.count === 1) existing.count = 2;
                    else this.links = this.links.filter(l => l !== existing);
                } else {
                    this.links.push({a: a, b: b, count: 1});
                }
                
                this.checkWin();
            }


            checkWin() {
                const allOk = this.nodes.every(n => {
                    let cur = 0;
                    this.links.forEach(l => { if(l.a===n || l.b===n) cur += l.count; });
                    return cur === n.req;
                });


                if(allOk && this.nodes.length > 0) {
                    this.winMsg.classList.add('visible');
                    setTimeout(() => this.generateLevel(), 2000);
                }
            }


            loop() {
                requestAnimationFrame(() => this.loop());
                this.update();
                this.draw();
            }
        }


        window.onload = () => new Game();
    </script>
</body>
</html>

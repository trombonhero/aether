<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER: Retina Ready</title>
    <style>
        /* --- VISUAL CONFIG --- */
        :root { 
            --bg: #020617; 
            --accent: #22d3ee; 
            --text: #94a3b8;
            --complete: #38bdf8;
            --error: #ef4444;
            --panel-bg: rgba(15, 23, 42, 0.8);
        }


        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh; width: 100vw;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            display: flex; flex-direction: column;
        }


        /* UI LAYER */
        #ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
            padding: 1.5rem;
        }


        /* HEADER */
        .top-bar {
            display: flex; justify-content: space-between; align-items: flex-start;
            width: 100%; pointer-events: auto;
        }


        .title-group { text-align: left; }


        h1 { 
            font-size: 1.8rem; margin: 0; letter-spacing: 0.3em; 
            color: white; text-shadow: 0 0 20px var(--accent); 
            font-weight: 300;
        }
        
        /* STATUS BAR */
        .subtitle { 
            font-size: 0.75rem; letter-spacing: 0.1em; margin-top: 6px; 
            color: var(--accent); opacity: 0.9; font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: color 0.3s;
        }
        .subtitle.err { color: var(--error); }
        .subtitle.ok { color: var(--accent); }


        /* CONTROLS (Top Right) */
        .actions { display: flex; gap: 1rem; }


        .btn-icon {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #475569;
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(4px);
            color: #a78bfa;
        }
        .btn-icon:active { transform: scale(0.9); background: var(--accent); border-color: var(--accent); color: #000; }
        .btn-icon svg { width: 24px; height: 24px; stroke-width: 2; fill: none; stroke: currentColor; }


        /* CANVAS */
        canvas { display: block; width: 100%; height: 100%; }


        /* WIN OVERLAY */
        #win-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0; transition: opacity 1s; pointer-events: none;
            z-index: 20;
        }
        #win-msg.visible { opacity: 1; }
        .win-text { 
            font-size: 3rem; color: var(--complete); 
            letter-spacing: 0.5em; text-shadow: 0 0 40px var(--complete); 
            font-weight: 100;
        }


        /* ANIMATIONS */
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 75% { transform: rotate(-15deg); } 100% { transform: rotate(0deg); } }
        .shaking { animation: shake 0.4s ease-in-out; }


    </style>
</head>
<body>


    <div id="ui-layer">
        <div class="top-bar">
            <div class="title-group">
                <h1>AETHER</h1>
                <div class="subtitle" id="status-text">STABILIZZA LA RETE</div>
            </div>


            <div class="actions">
                <div class="btn-icon" id="btn-dice" title="Scossa / Attiva Sensori">
                    <svg viewBox="0 0 24 24" id="dice-svg"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </div>
            </div>
        </div>


        <div id="win-msg">
            <div class="win-text">LINKED</div>
        </div>
    </div>


    <canvas id="canvas"></canvas>


    <script>
        // --- CONFIG ---
        const COLORS = {
            base: '#1e293b',
            stroke: '#475569',
            active: '#22d3ee', 
            error: '#ef4444',  
            complete: '#0f172a',
            linkGlow: 'rgba(34, 211, 238, 0.4)'
        };


        const PHYSICS = {
            topPadding: 130,    
            bottomPadding: 100, 
            sidePadding: 30,    
            repulsion: 400, 
            springLen: 160,
            friction: 0.93,
            shakeThreshold: 15
        };


        class AetherGame {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.statusEl = document.getElementById('status-text');
                this.winMsg = document.getElementById('win-msg');
                
                this.nodes = [];
                this.links = []; 
                
                this.drag = { active: false, startNode: null, curr: {x:0,y:0} };
                this.lastShakeTime = 0;


                // Bind resize first
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Input Unificato
                this.canvas.addEventListener('pointerdown', e => this.onDown(e));
                window.addEventListener('pointermove', e => this.onMove(e));
                window.addEventListener('pointerup', e => this.onUp(e));
                
                // Buttons
                document.getElementById('btn-dice').addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    this.requestMotionPermission(); 
                    this.shakeWorld(); 
                });


                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', e => this.handleMotion(e));
                }


                this.generateLevel();
                this.loop();
            }


            resize() {
                // HIGH DPI FIX: Calcola la densità reale dei pixel
                const dpr = window.devicePixelRatio || 1;
                
                // Dimensioni logiche (CSS pixels)
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                
                // Imposta le dimensioni del buffer interno moltiplicate per il DPR
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                
                // Scala tutto il contesto di disegno per adattarsi
                this.ctx.scale(dpr, dpr);
                
                // Nota: CSS width/height sono già gestiti dal layout al 100%
            }


            // --- MOTION CONTROL ---
            requestMotionPermission() {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('devicemotion', e => this.handleMotion(e));
                            }
                        })
                        .catch(console.error);
                }
            }


            handleMotion(e) {
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y);


                if (magnitude > PHYSICS.shakeThreshold) {
                    const now = Date.now();
                    if (now - this.lastShakeTime > 800) {
                        this.lastShakeTime = now;
                        this.shakeWorld();
                    }
                }
            }


            // --- LEVEL GEN ---
            generateLevel() {
                this.nodes = [];
                this.links = [];
                this.winMsg.classList.remove('visible');
                this.setStatus("COLLEGA I NODI", "ok");
                
                const nodeCount = Math.floor(Math.random() * 3) + 6; 
                const safeW = this.width - PHYSICS.sidePadding*2;
                const safeH = this.height - PHYSICS.topPadding - PHYSICS.bottomPadding;


                for(let i=0; i<nodeCount; i++) {
                    this.nodes.push({
                        id: i,
                        x: Math.random() * safeW + PHYSICS.sidePadding,
                        y: Math.random() * safeH + PHYSICS.topPadding,
                        vx: 0, vy: 0,
                        req: 0,
                        radius: 28 
                    });
                }


                let connected = [this.nodes[0]];
                let pool = this.nodes.slice(1);
                let solLinks = [];


                while(pool.length > 0) {
                    const src = connected[Math.floor(Math.random() * connected.length)];
                    const dst = pool[Math.floor(Math.random() * pool.length)];
                    const count = Math.random() > 0.7 ? 2 : 1;
                    solLinks.push({p1: src, p2: dst, count});
                    connected.push(dst);
                    pool = pool.filter(n => n !== dst);
                }


                for(let i=0; i<2; i++) {
                    const a = this.nodes[Math.floor(Math.random()*this.nodes.length)];
                    const b = this.nodes[Math.floor(Math.random()*this.nodes.length)];
                    if(a !== b && !solLinks.some(l => (l.p1===a && l.p2===b) || (l.p1===b && l.p2===a))) {
                        solLinks.push({p1: a, p2: b, count: 1});
                    }
                }


                this.nodes.forEach(n => {
                    let req = 0;
                    solLinks.forEach(l => { if(l.p1===n || l.p2===n) req += l.count; });
                    n.req = req;
                });


                this.nodes = this.nodes.filter(n => n.req > 0);
            }


            shakeWorld() {
                document.getElementById('dice-svg').classList.add('shaking');
                setTimeout(() => document.getElementById('dice-svg').classList.remove('shaking'), 400);
                this.setStatus("SCOSSA FISICA", "ok");
                
                this.nodes.forEach(n => {
                    n.vx += (Math.random() - 0.5) * 35; 
                    n.vy += (Math.random() - 0.5) * 35;
                });
            }


            // --- FISICA ---
            update() {
                for(let i=0; i<this.nodes.length; i++) {
                    for(let j=i+1; j<this.nodes.length; j++) {
                        const a = this.nodes[i];
                        const b = this.nodes[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx*dx + dy*dy;
                        const dist = Math.sqrt(distSq);
                        
                        if(dist < PHYSICS.repulsion) { 
                            const force = PHYSICS.repulsion / (distSq + 1); 
                            const fx = (dx/dist) * force;
                            const fy = (dy/dist) * force;
                            a.vx += fx; a.vy += fy;
                            b.vx -= fx; b.vy -= fy;
                        }
                    }
                }


                this.links.forEach(l => {
                    const dx = l.b.x - l.a.x;
                    const dy = l.b.y - l.a.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    const force = (dist - PHYSICS.springLen) * 0.008; 
                    const fx = (dx/dist) * force;
                    const fy = (dy/dist) * force;
                    
                    l.a.vx += fx; l.a.vy += fy;
                    l.b.vx -= fx; l.b.vy -= fy;
                });


                const safeCenterY = PHYSICS.topPadding + (this.height - PHYSICS.topPadding - PHYSICS.bottomPadding) / 2;
                const safeCenterX = this.width / 2;


                this.nodes.forEach(n => {
                    n.vx += (safeCenterX - n.x) * 0.0002; 
                    n.vy += (safeCenterY - n.y) * 0.0002;
                    n.x += n.vx; n.y += n.vy;
                    n.vx *= PHYSICS.friction; n.vy *= PHYSICS.friction;


                    const p = PHYSICS.sidePadding;
                    const tp = PHYSICS.topPadding;
                    const bp = PHYSICS.bottomPadding;


                    if(n.x < p) { n.x = p; n.vx *= -0.6; }
                    if(n.x > this.width - p) { n.x = this.width - p; n.vx *= -0.6; }
                    if(n.y < tp) { n.y = tp; n.vy *= -0.6; }
                    if(n.y > this.height - bp) { n.y = this.height - bp; n.vy *= -0.6; }
                });
            }


            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);


                this.links.forEach(l => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(l.a.x, l.a.y);
                    this.ctx.lineTo(l.b.x, l.b.y);
                    
                    if(l.count === 2) {
                        this.ctx.lineWidth = 7;
                        this.ctx.strokeStyle = COLORS.linkGlow;
                        this.ctx.stroke();
                        this.ctx.lineWidth = 2.5;
                        this.ctx.strokeStyle = '#fff';
                        this.ctx.stroke();
                    } else {
                        this.ctx.lineWidth = 2.5;
                        this.ctx.strokeStyle = COLORS.active;
                        this.ctx.stroke();
                    }
                });


                if(this.drag.active) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.drag.startNode.x, this.drag.startNode.y);
                    this.ctx.lineTo(this.drag.curr.x, this.drag.curr.y);
                    
                    this.ctx.strokeStyle = '#facc15'; 
                    this.ctx.lineWidth = 3;
                    this.ctx.setLineDash([8, 8]);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }


                this.nodes.forEach(n => {
                    let cur = this.curCount(n);
                    const isComplete = cur === n.req;
                    const isOver = cur > n.req;


                    if(isComplete) {
                        this.ctx.shadowBlur = 30;
                        this.ctx.shadowColor = COLORS.active;
                    } else {
                        this.ctx.shadowBlur = 0;
                    }


                    this.ctx.beginPath();
                    this.ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
                    this.ctx.fillStyle = isComplete ? COLORS.complete : COLORS.base;
                    this.ctx.fill();
                    
                    this.ctx.lineWidth = isComplete ? 3 : 2;
                    let strokeCol = isOver ? COLORS.error : (isComplete ? COLORS.active : COLORS.stroke);
                    
                    this.ctx.strokeStyle = strokeCol;
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;


                    this.ctx.fillStyle = isComplete ? '#fff' : COLORS.active;
                    this.ctx.font = "bold 24px Courier New";
                    this.ctx.textAlign = "center";
                    this.ctx.textBaseline = "middle";
                    this.ctx.fillText(n.req, n.x, n.y + 2);
                });
            }


            // --- INPUT ---
            getPos(e) { return { x: e.clientX, y: e.clientY }; }
            
            distToSegment(p, v, w) {
                const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
                if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
                let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
            }


            onDown(e) {
                const pos = this.getPos(e);
                
                // 1. Drag Node
                const target = this.nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < n.radius + 15);
                if(target) {
                    this.drag.active = true;
                    this.drag.startNode = target;
                    this.drag.curr = pos;
                    this.setStatus("TRASCINA...", "ok");
                    return;
                }


                // 2. Cut Link (Hitbox ampia)
                for(let i=0; i<this.links.length; i++) {
                    const l = this.links[i];
                    if(this.distToSegment(pos, l.a, l.b) < 30) {
                        this.links.splice(i, 1);
                        this.setStatus("TAGLIO NETTO", "err");
                        this.checkWin();
                        return;
                    }
                }
            }


            onMove(e) { if(this.drag.active) this.drag.curr = this.getPos(e); }


            onUp(e) {
                if(!this.drag.active) return;
                const pos = this.getPos(e);
                
                const target = this.nodes.find(n => 
                    n !== this.drag.startNode && 
                    Math.hypot(n.x - pos.x, n.y - pos.y) < n.radius + 20
                );


                if(target) this.toggleLink(this.drag.startNode, target);
                
                this.drag.active = false;
                this.setStatus("SISTEMA ONLINE", "");
                this.checkWin();
            }


            toggleLink(a, b) {
                const existing = this.getLink(a.id, b.id);
                if(existing) {
                    if(existing.count === 1) existing.count = 2; // Upgrade
                    else this.links = this.links.filter(l => l !== existing); // Delete
                } else {
                    this.links.push({a: a, b: b, count: 1});
                }
            }


            curCount(n) { let c=0; this.links.forEach(l=>{if(l.a===n||l.b===n)c+=l.count}); return c; }
            getLink(id1, id2) { return this.links.find(l => (l.a.id===id1 && l.b.id===id2) || (l.a.id===id2 && l.b.id===id1)); }
            
            setStatus(msg, type) { 
                this.statusEl.textContent = msg; 
                this.statusEl.className = "subtitle " + (type || ""); 
            }


            checkWin() {
                const allOk = this.nodes.every(n => this.curCount(n) === n.req);
                if(allOk && this.nodes.length>0) {
                    let adj={}; this.nodes.forEach(n=>adj[n.id]=[]);
                    this.links.forEach(l=>{adj[l.a.id].push(l.b.id); adj[l.b.id].push(l.a.id);});
                    let q=[this.nodes[0].id], vis=new Set([this.nodes[0].id]);
                    while(q.length){
                        let c=q.pop();
                        for(let x of adj[c]) if(!vis.has(x)) { vis.add(x); q.push(x); }
                    }
                    if(vis.size === this.nodes.length) {
                        this.winMsg.classList.add('visible');
                        setTimeout(() => this.generateLevel(), 2500);
                    }
                }
            }


            loop() { requestAnimationFrame(() => this.loop()); this.update(); this.draw(); }
        }


        window.onload = () => new AetherGame();
    </script>
</body>
</html>
